version: "3.8"

# ─── Production Deployment ───────────────────────────────────────────────
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
# 1. Buy a domain and point MX records to your server
# 2. Copy .env.example to .env and configure
# 3. Run: docker compose -f docker-compose.prod.yml up -d
#
# For SSL:
# - Uncomment the certbot section below
# - Set your email in docker-compose.prod.yml
# - First run: docker compose -f docker-compose.prod.yml run --rm certbot
# - Then restart nginx: docker compose restart nginx

services:
  # ─── SMTP Mail Server ──────────────────────────────────────────────────
  smtp:
    build:
      context: .
      dockerfile: docker/Dockerfile.smtp
    container_name: mailghost-smtp
    ports:
      - "25:25"
      - "587:587"     # Submission (with STARTTLS)
    volumes:
      - smtp-data:/app/data
    environment:
      - SMTP_PORT=25
      - SMTP_API_PORT=3001
      - SMTP_DATA_DIR=/app/data
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-tempver.com}
      - SMTP_AUTH_USER=${SMTP_AUTH_USER:-}
      - SMTP_AUTH_PASS=${SMTP_AUTH_PASS:-}
      - NODE_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Next.js Web App ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: mailghost-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SMTP_API_URL=http://smtp:3001
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://yourdomain.com}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-tempver.com}
      - LOG_LEVEL=info
    depends_on:
      smtp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx Reverse Proxy (with SSL termination) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mailghost-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/letsencrypt:ro
      - nginx-www:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Let's Encrypt Certbot (uncomment for SSL) ────────────────────────
  # certbot:
  #   image: certbot/certbot
  #   container_name: mailghost-certbot
  #   volumes:
  #     - nginx-certs:/etc/letsencrypt
  #     - nginx-www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  smtp-data:
    driver: local
  nginx-certs:
    driver: local
  nginx-www:
    driver: local
