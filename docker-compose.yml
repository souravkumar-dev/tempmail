version: "3.8"

services:
  # ─── SMTP Mail Server ──────────────────────────────────────────────────
  smtp:
    build:
      context: .
      dockerfile: docker/Dockerfile.smtp
    ports:
      - "25:25"       # SMTP (required for receiving emails)
      - "3001:3001"   # Internal API
    volumes:
      - smtp-data:/app/data
    environment:
      - SMTP_PORT=25
      - API_PORT=3001
      - DB_PATH=/app/data/emails.db
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-tempver.com,mailfak.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/mail/stats?address=test@test.com"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Next.js Web App ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - SMTP_API_URL=http://smtp:3001
      - NEXT_PUBLIC_SMTP_API_URL=http://smtp:3001
    depends_on:
      - smtp
    restart: unless-stopped

volumes:
  smtp-data:
